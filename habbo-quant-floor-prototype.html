<!-- PixiJS v8 via multiple CDNs with fallback -->
<script>
  window.pixiLoaded = false;
  window.pixiError = null;
  
  function loadPixiJS() {
    const cdns = [
      'https://cdn.jsdelivr.net/npm/pixi.js@8.1.4/dist/pixi.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.4/pixi.min.js',
      'https://unpkg.com/pixi.js@8.1.4/dist/pixi.min.js'
    ];
    
    let current = 0;
    function tryNext() {
      if (current >= cdns.length) {
        logDebug('ERROR: All PixiJS CDNs failed', 'error');
        document.getElementById('loadStatus').textContent = 'Error cargando PixiJS';
        document.getElementById('loadError').textContent = 'No se pudo cargar PixiJS. Verifica conexión a internet.';
        document.getElementById('loadError').style.display = 'block';
        return;
      }
      logDebug(`Cargando PixiJS desde ${cdns[current]}...`);
      const script = document.createElement('script');
      script.src = cdns[current];
      script.onload = () => {
        window.pixiLoaded = true;
        logDebug('PixiJS cargado OK ✓', 'ok');
        document.getElementById('loadStatus').textContent = 'PixiJS listo. Construyendo floor...';
        setTimeout(initApp, 100);
      };
      script.onerror = () => {
        logDebug(`Fallo CDN ${current + 1}`, 'warn');
        current++;
        tryNext();
      };
      document.head.appendChild(script);
    }
    tryNext();
  }
  
  function logDebug(msg, type = 'info') {
    const log = document.getElementById('debugLog');
    const line = document.createElement('div');
    line.className = `debug-line ${type}`;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    console.log(`[DEBUG] ${msg}`);
  }
  
  window.logDebug = logDebug;
  
  // Start loading PixiJS
  loadPixiJS();
</script>

<script>
// ============================================================
// HABBO QUANT FLOOR — PIXIJS PROTOTYPE (continúa tras carga)
// ============================================================

// ============ CONFIG ============
const TILE_W = 64, TILE_H = 32;
const GRID_W = 80, GRID_H = 60;
const ZONE_SIZE = 16;
const CORRIDOR_W = 4;

const ZONES = {
  research:    { name: 'RESEARCH',      color: 0x0066ff, accent: 0x0099ff, x: 8,  y: 8,  emoji: '🔬', desc: 'Discovery Lab · Pattern Mine · Hypothesis Queue' },
  validation:  { name: 'VALIDATION',    color: 0x00ccaa, accent: 0x00ffdd, x: 26, y: 8,  emoji: '⚖️', desc: 'Walk-Forward Chamber · Monte Carlo · Referee' },
  execution:   { name: 'EXECUTION',     color: 0x00cc66, accent: 0x00ff88, x: 44, y: 8,  emoji: '💰', desc: 'Order Desk · Risk Check · Fill Tracker' },
  guardian:    { name: 'GUARDIAN',      color: 0xff8800, accent: 0xffaa00, x: 44, y: 36, emoji: '🛡️', desc: 'Shield Vault · 8 Guards · Kill Switch' },
  regime:      { name: 'REGIME',        color: 0x8844ff, accent: 0xaa66ff, x: 26, y: 36, emoji: '🌊', desc: 'HMM 4-State · Probability Bars · Transitions' },
  alpha:       { name: 'ALPHA LIBRARY', color: 0xffcc00, accent: 0xffdd44, x: 8,  y: 36, emoji: '🧠', desc: 'Knowledge Graph · Playbooks · Causal Paths' },

const CHIEF_CENTER = { x: 32, y: 22, size: 12 };
const ENTRANCE = { x: 30, y: 0, w: 20, h: 6 };
const CORRIDOR_Y = 24;

const LIVE_DATA = {
  regime: 'trend_up',
  killSwitch: false,
  nightlyProgress: 0.8,
  nightlyState: 'running',
  pnl: 12847,
  tradesToday: 47,
  guards: [
    { name: 'Daily Loss', current: 234, limit: 1500, ok: true },
    { name: 'Trailing DD', current: 8.2, limit: 15, ok: true },
    { name: 'Contracts', current: 3, limit: 10, ok: true },
    { name: 'Correlation', current: 0.34, limit: 0.5, ok: true },
    { name: 'Loss Streak', current: 0, limit: 3, ok: true },
    { name: 'Trade Freq', current: 12, limit: 50, ok: true },
    { name: 'Strategy DD', current: 4.1, limit: 10, ok: true },
    { name: 'Cooldown', current: 0, limit: 1, ok: true },
  ],
  zoneMetrics: {
    research:    { patterns: 847, hypotheses: 12, queue: 5, active: 3 },
    validation:  { folds: '3/8', passed: 2, failed: 1, mcRunning: true },
    execution:   { signals: 4, pending: 1, fills: 3, slipBps: 1.2 },
    guardian:    { alerts: 0, cooldown: false, overrides: 0 },
    regime:      { state: 'trend_up', confidence: 0.87, nextChange: '~45min' },
    alpha:       { strategies: 8, insights: 23, errors: 41, queries: 7 },
  }
};

// ============ STATE ============
let app, floorContainer, uiContainer;
let operatorAvatar, chiefAvatar, agentAvatars = [];
let currentZone = null;
let cameraTarget = { x: 0, y: 0 };
let cameraPos = { x: 0, y: 0 };
let zoom = 1;
let reducedMotion = false;
let minimapVisible = true;
let chatMessages = [];

// Avatar debug labels (DOM overlay)
let avatarLabels = {};

// ============ INIT ============
async function initApp() {
  try {
    logDebug('Iniciando PIXI.Application...');
    app = new PIXI.Application();
    await app.init({
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 0x0a0a0f,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true,
      antialias: true,
    });
    document.getElementById('app').appendChild(app.canvas);
    app.canvas.style.zIndex = '1'; // Behind overlays
    logDebug('Canvas añadido al DOM', 'ok');
    
    // Hide loading
    document.getElementById('loading').style.display = 'none';
    
    // Containers
    floorContainer = new PIXI.Container();
    app.stage.addChild(floorContainer);
    
    uiContainer = new PIXI.Container();
    app.stage.addChild(uiContainer);
    
    // Build floor
    logDebug('Construyendo floor...');
    buildFloor();
    
    // Create avatars
    logDebug('Creando avatares...');
    createAvatars();
    
    // Create avatar debug labels (DOM)
    createAvatarLabels();
    
    // Setup camera - START AT OPERATOR POSITION
    cameraTarget.x = operatorAvatar.gridX * TILE_W; // Will be set after avatar creation
    cameraTarget.y = operatorAvatar.gridY * TILE_H;
    cameraPos.x = cameraTarget.x;
    cameraPos.y = cameraTarget.y;
    
    // Input
    setupInput();
    
    // Start loops
    app.ticker.add(gameLoop);
    startLiveUpdates();
    
    // Initial chat
    addChatMessage('chief', 'Chief of Staff online. Floor operational. All systems nominal.');
    addChatMessage('chief', 'Commands: "run nightly", "kill switch", "pause", "resume", "status"');
    
    // Handle resize
    window.addEventListener('resize', onResize);
    
    logDebug('🏗️ NEXUS QUANT FLOOR prototype ready!', 'ok');
  } catch (e) {
    logDebug(`ERROR INICIALIZACIÓN: ${e.message}`, 'error');
    console.error(e);
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loadStatus').textContent = 'Error de inicialización';
    document.getElementById('loadError').textContent = e.message;
    document.getElementById('loadError').style.display = 'block';
  }
}

function onResize() {
  if (app) app.renderer.resize(window.innerWidth, window.innerHeight);
  // Reposition avatar labels
  updateAvatarLabels();
}

// ============ FLOOR BUILDING ============
function buildFloor() {
  const graphics = new PIXI.Graphics();
  floorContainer.addChild(graphics);
  
  drawBaseFloor(graphics);
  Object.entries(ZONES).forEach(([key, zone]) => drawZone(graphics, key, zone));
  drawChiefCenter(graphics);
  drawEntrance(graphics);
  drawCorridor(graphics);
  drawSouthSupport(graphics);
  drawZoneLabels();
  graphics.cacheAsTexture = true;
  logDebug('Floor construido y cacheado', 'ok');
}

function drawBaseFloor(g) {
  g.rect(0, 0, GRID_W * TILE_W, GRID_H * TILE_H);
  g.fill(0x0a0a0f);
  g.stroke({ width: 0.5, color: 0x1a1a2e, alpha: 0.3 });
  for (let gx = 0; gx <= GRID_W; gx++) {
    const s1 = gridToScreen(gx, 0), s2 = gridToScreen(gx, GRID_H);
    g.moveTo(s1.x, s1.y).lineTo(s2.x, s2.y);
  }
  for (let gy = 0; gy <= GRID_H; gy++) {
    const s1 = gridToScreen(0, gy), s2 = gridToScreen(GRID_W, gy);
    g.moveTo(s1.x, s1.y).lineTo(s2.x, s2.y);
  }
}

function drawZone(g, key, zone) {
  const { x, y, color, accent } = zone;
  const px = x * TILE_W, py = y * TILE_H;
  const zw = ZONE_SIZE * TILE_W, zh = ZONE_SIZE * TILE_H;
  
  const isoPoints = getIsoRect(px, py, zw, zh);
  g.poly(isoPoints);
  g.fill({ color, alpha: 0.15 });
  g.stroke({ width: 2, color: accent, alpha: 0.6 });
  
  g.stroke({ width: 0.5, color: accent, alpha: 0.1 });
  for (let i = 1; i < ZONE_SIZE; i++) {
    const p1 = gridToScreen(x + i, y), p2 = gridToScreen(x + i, y + ZONE_SIZE);
    g.moveTo(p1.x, p1.y).lineTo(p2.x, p2.y);
    const p3 = gridToScreen(x, y + i), p4 = gridToScreen(x + ZONE_SIZE, y + i);
    g.moveTo(p3.x, p3.y).lineTo(p4.x, p4.y);
  }
  drawZoneCorners(g, px, py, zw, zh, accent);
}

function drawZoneCorners(g, px, py, w, h, color) {
  const corners = getIsoRect(px, py, w, h);
  g.stroke({ width: 3, color, alpha: 0.8 });
  const size = 20;
  corners.forEach((pt, i) => {
    const next = corners[(i + 1) % 4];
    const dx = next.x - pt.x, dy = next.y - pt.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = dx / len, uy = dy / len;
    g.moveTo(pt.x, pt.y).lineTo(pt.x + ux * size, pt.y + uy * size);
    g.moveTo(next.x, next.y).lineTo(next.x - ux * size, next.y - uy * size);
  });
}

function createHabboAvatar(type, color) {
  const container = new PIXI.Container();
  container.type = type;
  container.direction = 'down';
  container.walkFrame = 0;
  container.walkTimer = 0;
  container.isWalking = false;
  container.bobPhase = Math.random() * Math.PI * 2;
  container.bobAmount = type === 'chief' ? 2 : 1.5;
  
  const body = new PIXI.Graphics();
  // Head
  body.roundRect(-12, -36, 24, 24, 6).fill({ color: 0xffe0bd }).stroke({ width: 1, color: 0xccaa88 });
  body.circle(-6, -28, 2).fill(0x1a1a2e);
  body.circle(6, -28, 2).fill(0x1a1a2e);
  // Torso
  body.roundRect(-16, -12, 32, 28, 4).fill({ color, alpha: 0.9 }).stroke({ width: 1, color: lightenColor(color, 30) });
  // Legs
  body.roundRect(-10, 16, 8, 20, 2).fill({ color: 0x1a1a2e });
  body.roundRect(2, 16, 8, 20, 2).fill({ color: 0x1a1a2e });
  
  if (type === 'chief') {
    body.stroke({ width: 2, color: 0xffcc00, alpha: 0.8 }).roundRect(-18, -38, 36, 56, 8);
  } else if (type !== 'operator') {
    body.stroke({ width: 1.5, color: lightenColor(color, 40), alpha: 0.6 }).roundRect(-18, -38, 36, 56, 8);
  }
  
  container.addChild(body);
  container.body = body;
  
  // Selection ring (voice indicator)
  const ring = new PIXI.Graphics();
  ring.stroke({ width: 3, color: 0x00d4aa, alpha: 0 }).circle(0, -8, 32);
  container.addChild(ring);
  container.selectionRing = ring;
  
  // Name label (PixiJS)
  const nameLabel = new PIXI.Text({ text: type.toUpperCase(), style: { fontFamily: 'JetBrains Mono', fontSize: 9, fill: 0x7a7a8a, fontWeight: '600', stroke: { color: 0x0a0a0f, width: 2 } } });
  nameLabel.anchor.set(0.5);
  nameLabel.y = -52;
  container.addChild(nameLabel);
  container.nameLabel = nameLabel;
  
  return container;
}

function lightenColor(color, percent) {
  const r = (color >> 16) & 255, g = (color >> 8) & 255, b = color & 255;
  const nr = Math.min(255, r + Math.round(255 * percent / 100));
  const ng = Math.min(255, g + Math.round(255 * percent / 100));
  const nb = Math.min(255, b + Math.round(255 * percent / 100));
  return (nr << 16) | (ng << 8) | nb;
}

// ============ GAME LOOP ============
function gameLoop(delta) {
  const dt = delta * (1/60);
  updateAvatar(operatorAvatar, dt);
  updateAvatar(chiefAvatar, dt, true);
  agentAvatars.forEach(a => updateAvatar(a, dt));
  
  // Camera follows operator
  const opScreen = gridToScreen(operatorAvatar.gridX, operatorAvatar.gridY);
  cameraTarget.x = opScreen.x - window.innerWidth * 0.15;
  cameraTarget.y = opScreen.y - window.innerHeight * 0.1;
  
  const lerpFactor = reducedMotion ? 1 : 0.08;
  cameraPos.x += (cameraTarget.x - cameraPos.x) * lerpFactor;
  cameraPos.y += (cameraTarget.y - cameraPos.y) * lerpFactor;
  
  floorContainer.position.x = window.innerWidth/2 - cameraPos.x * zoom;
  floorContainer.position.y = window.innerHeight/2 - cameraPos.y * zoom;
  floorContainer.scale.set(zoom);
  
  uiContainer.position.x = -floorContainer.position.x / zoom;
  uiContainer.position.y = -floorContainer.position.y / zoom;
  uiContainer.scale.set(1/zoom);
  
  updateMinimap();
  updateAvatarLabels();
  updateClock();
}

function updateAvatar(avatar, dt, isChief = false) {
  const dx = avatar.targetGridX - avatar.gridX;
  const dy = avatar.targetGridY - avatar.gridY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  
  if (dist > 0.05) {
    avatar.isWalking = true;
    const speed = avatar.speed * dt;
    const moveX = Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) * Math.min(speed, Math.abs(dx)) : dx * (speed / (dist || 1));
    const moveY = Math.abs(dy) > Math.abs(dx) ? Math.sign(dy) * Math.min(speed, Math.abs(dy)) : dy * (speed / (dist || 1));
    avatar.gridX += moveX; avatar.gridY += moveY;
    
    if (Math.abs(moveX) > Math.abs(moveY)) avatar.direction = moveX > 0 ? 'right' : 'left';
    else avatar.direction = moveY > 0 ? 'down' : 'up';
    
    avatar.walkTimer += dt * 10;
    if (avatar.walkTimer >= 1) {
      avatar.walkTimer = 0;
      avatar.walkFrame = (avatar.walkFrame + 1) % 4;
      if (!reducedMotion) avatar.body.scale.y = avatar.walkFrame % 2 === 0 ? 1.0 : 0.95;
    }
  } else {
    avatar.isWalking = false;
    avatar.gridX = avatar.targetGridX; avatar.gridY = avatar.targetGridY;
    avatar.walkFrame = 0; avatar.body.scale.y = 1;
  }
  
  if (!avatar.isWalking && !reducedMotion) {
    if (isChief) {
      avatar.bobPhase += dt * 1.5;
      avatar.body.y = Math.sin(avatar.bobPhase) * avatar.bobAmount;
      if (avatar.voiceRingActive) {
        avatar.voiceRingTimer -= dt;
        const pulse = Math.sin(avatar.voiceRingTimer * 20) * 0.5 + 0.5;
        avatar.selectionRing.alpha = pulse * 0.6;
        avatar.selectionRing.scale.set(1 + pulse * 0.3);
        if (avatar.voiceRingTimer <= 0) { avatar.voiceRingActive = false; avatar.selectionRing.alpha = 0; avatar.selectionRing.scale.set(1); }
      }
    } else {
      avatar.bobPhase += dt * 3;
      avatar.body.y = Math.sin(avatar.bobPhase) * avatar.bobAmount;
    }
  }
  
  if (avatar.zoneKey && !avatar.isWalking) {
    avatar.patrolTimer -= dt;
    if (avatar.patrolTimer <= 0) {
      const zone = ZONES[avatar.zoneKey];
      avatar.targetGridX = zone.x + ZONE_SIZE/2 + (Math.random() - 0.5) * 8;
      avatar.targetGridY = zone.y + ZONE_SIZE/2 + (Math.random() - 0.5) * 8;
      avatar.patrolTimer = avatar.patrolInterval;
    }
  }
  
  const screen = gridToScreen(avatar.gridX, avatar.gridY);
  avatar.position.set(screen.x, screen.y);
}

function gridToScreen(gx, gy) {
  return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
}

function screenToGrid(sx, sy) {
  return { x: (sx / (TILE_W/2) + sy / (TILE_H/2)) / 2, y: (sy / (TILE_H/2) - sx / (TILE_W/2)) / 2 };
}

function getIsoRect(px, py, w, h) {
  const corners = [
    gridToScreen(px/TILE_W, py/TILE_H),
    gridToScreen((px+w)/TILE_W, py/TILE_H),
    gridToScreen((px+w)/TILE_W, (py+h)/TILE_H),
    gridToScreen(px/TILE_W, (py+h)/TILE_H),
  ];
  return corners.flatMap(p => [p.x, p.y]);
}

// ============ INPUT ============
const keys = { w: false, a: false, s: false, d: false };
function setupInput() {
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (keys.hasOwnProperty(k)) { keys[k] = true; e.preventDefault(); }
    if (k === ' ') { focusChief(); e.preventDefault(); }
    if (k === 'm') { toggleMinimap(); }
    if (k === 'r') { toggleReducedMotion(!reducedMotion); }
    if (k === 'd') { document.getElementById('debugPanel').classList.toggle('open'); }
    if (k === 'escape') { closeZonePanel(); }
  });
  window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = false; });
  
  app.canvas.addEventListener('click', e => {
    if (e.target !== app.canvas) return;
    const rect = app.canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left - floorContainer.position.x) / zoom;
    const sy = (e.clientY - rect.top - floorContainer.position.y) / zoom;
    const grid = screenToGrid(sx, sy);
    
    const clickedZone = getZoneAt(grid.x, grid.y);
    if (clickedZone) { openZonePanel(clickedZone); }
    else if (isInChiefCenter(grid.x, grid.y)) { openZonePanel('chief'); }
    else {
      operatorAvatar.targetGridX = Math.max(1, Math.min(GRID_W-1, grid.x));
      operatorAvatar.targetGridY = Math.max(1, Math.min(GRID_H-1, grid.y));
    }
  });
  
  setInterval(() => {
    if (!operatorAvatar.isWalking) {
      let moved = false;
      if (keys.w) { operatorAvatar.targetGridY -= 1; moved = true; }
      if (keys.s) { operatorAvatar.targetGridY += 1; moved = true; }
      if (keys.a) { operatorAvatar.targetGridX -= 1; moved = true; }
      if (keys.d) { operatorAvatar.targetGridX += 1; moved = true; }
      if (moved) {
        operatorAvatar.targetGridX = Math.max(1, Math.min(GRID_W-1, operatorAvatar.targetGridX));
        operatorAvatar.targetGridY = Math.max(1, Math.min(GRID_H-1, operatorAvatar.targetGridY));
      }
    }
  }, 100);
}

function getZoneAt(gx, gy) {
  for (const [key, zone] of Object.entries(ZONES)) {
    if (gx >= zone.x && gx < zone.x + ZONE_SIZE && gy >= zone.y && gy < zone.y + ZONE_SIZE) return key;
  }
  return null;
}

function isInChiefCenter(gx, gy) {
  const { x, y, size } = CHIEF_CENTER;
  return gx >= x && gx < x + size && gy >= y && gy < y + size;
}

function openZonePanel(zoneKey) {
  currentZone = zoneKey;

  const colorEl = document.getElementById('zonePanelColor');
  const content = document.getElementById('zonePanelContent');
  const actions = document.getElementById('zonePanelActions');
  
  if (zoneKey === 'chief') {
    title.textContent = 'CHIEF COMMAND CENTER';
    colorEl.style.background = '#ffcc00';
    content.innerHTML = buildChiefPanelContent();
    actions.innerHTML = buildChiefPanelActions();
  } else {
    const zone = ZONES[zoneKey];
    const metrics = LIVE_DATA.zoneMetrics[zoneKey];
    title.textContent = `${zone.emoji}  ${zone.name}`;
    colorEl.style.background = `#${zone.accent.toString(16).padStart(6, '0')}`;
    content.innerHTML = buildZonePanelContent(zoneKey, zone, metrics);
    actions.innerHTML = buildZonePanelActions(zoneKey);
  }
  panel.classList.add('open');
}

function closeZonePanel() { document.getElementById('zonePanel').classList.remove('open'); currentZone = null; }

function buildZonePanelContent(key, zone, metrics) {
  let html = `<div style="font-size:11px;color:#7a7a8a;margin-bottom:12px;">${zone.desc}</div><div style="display:flex;flex-direction:column;gap:6px;">`;
  Object.entries(metrics).forEach(([k, v]) => {
    const label = k.charAt(0).toUpperCase() + k.slice(1).replace(/([A-Z])/g, ' $1');
    let cls = '';
    if (typeof v === 'number' && v > 0) cls = 'positive';
    if (typeof v === 'number' && v < 0) cls = 'negative';
    html += `<div class="zone-metric"><span class="metric-label">${label}</span><span class="metric-value ${cls}">${v}</span></div>`;
  });
  return html + '</div>';
}

function buildZonePanelActions(key) {
  if (key === 'chief') return '';
  return `<button class="btn btn-primary" onclick="runZoneAction('${key}')">Run Cycle</button><button class="btn btn-ghost" onclick="viewZoneDetails('${key}')">Details</button>`;

  const labels = { run_nightly: 'Run Nightly', kill_switch: 'Kill Switch', pause: 'Pause Nightly', resume: 'Resume Nightly' };
  addChatMessage('user', labels[action]);
  if (action === 'kill_switch') { LIVE_DATA.killSwitch = !LIVE_DATA.killSwitch; updateTopBar(); addChatMessage('chief', LIVE_DATA.killSwitch ? '🚨 KILL SWITCH ACTIVATED.' : '✅ Kill switch deactivated.'); chiefAvatar.voiceRingActive = true; chiefAvatar.voiceRingTimer = 2; }
  else if (action === 'run_nightly') { LIVE_DATA.nightlyState = 'running'; animateNightlyProgress(); addChatMessage('chief', '🌙 Nightly loop started.'); }

}

// ============ MINIMAP ============
function updateMinimap() {
  const canvas = document.getElementById('minimapCanvas');
  const ctx = canvas.getContext('2d');
  const scale = 2;
  canvas.width = 220 * scale; canvas.height = 160 * scale;
  canvas.style.width = '220px'; canvas.style.height = '160px';
  ctx.scale(scale, scale);
  
  const mmW = 220, mmH = 160;
  const scaleX = mmW / (GRID_W * TILE_W), scaleY = mmH / (GRID_H * TILE_H);
  
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, mmW, mmH);
  
  Object.entries(ZONES).forEach(([key, zone]) => {
    ctx.fillStyle = `#${zone.color.toString(16).padStart(6, '0')}22`;
    ctx.strokeStyle = `#${zone.accent.toString(16).padStart(6, '0')}`;
    ctx.lineWidth = 1;
    const x = zone.x * TILE_W * scaleX, y = zone.y * TILE_H * scaleY;
    const w = ZONE_SIZE * TILE_W * scaleX, h = ZONE_SIZE * TILE_H * scaleY;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  });
  
  ctx.fillStyle = '#ffcc0033'; ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
  const cx = CHIEF_CENTER.x * TILE_W * scaleX, cy = CHIEF_CENTER.y * TILE_H * scaleY;
  const cw = CHIEF_CENTER.size * TILE_W * scaleX, ch = CHIEF_CENTER.size * TILE_H * scaleY;
  ctx.fillRect(cx, cy, cw, ch); ctx.strokeRect(cx, cy, cw, ch);
  
  ctx.fillStyle = '#00d4aa11'; ctx.fillRect(0, CORRIDOR_Y * TILE_H * scaleY, mmW, CORRIDOR_W * TILE_H * scaleY);
  
  [operatorAvatar, chiefAvatar, ...agentAvatars].forEach(av => {
    const s = gridToScreen(av.gridX, av.gridY);
    ctx.fillStyle = av.isChief ? '#ffcc00' : (av.type === 'operator' ? '#4488ff' : '#00d4aa');
    ctx.beginPath(); ctx.arc(s.x * scaleX, s.y * scaleY, 3, 0, Math.PI * 2); ctx.fill();
  });
  
  const frustumW = (window.innerWidth / zoom) * scaleX, frustumH = (window.innerHeight / zoom) * scaleY;
  ctx.strokeStyle = '#00d4aa'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.strokeRect(cameraPos.x * scaleX - frustumW/2, cameraPos.y * scaleY - frustumH/2, frustumW, frustumH);
  ctx.setLineDash([]);
}

function toggleMinimap() { minimapVisible = !minimapVisible; document.getElementById('minimap').style.display = minimapVisible ? 'block' : 'none'; }

// ============ CHAT ============
function addChatMessage(role, text) {
  const container = document.getElementById('chatMessages');
  const msg = document.createElement('div');
  msg.className = `chat-msg ${role}`;
  msg.innerHTML = `<div class="chat-avatar ${role}">${role === 'chief' ? '🤖' : '👤'}</div><div class="chat-bubble">${escapeHtml(text)}</div>`;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

function handleChatKeydown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if (!text) return;
  input.value = ''; addChatMessage('user', text); processChatCommand(text.toLowerCase());
}

function processChatCommand(cmd) {
  if (cmd.includes('kill') || cmd.includes('emergency')) chiefAction('kill_switch');
  else if (cmd.includes('run nightly') || cmd.includes('nightly now')) chiefAction('run_nightly');
  else if (cmd.includes('pause')) chiefAction('pause');
  else if (cmd.includes('resume') || cmd.includes('continue')) chiefAction('resume');
  else if (cmd.includes('status') || cmd.includes('estado')) addChatMessage('chief', `📊 Regime ${LIVE_DATA.regime.toUpperCase()} | PnL $${LIVE_DATA.pnl.toLocaleString()} | Trades ${LIVE_DATA.tradesToday} | Guardian ${LIVE_DATA.killSwitch ? 'KILL' : 'SAFE'} | Nightly ${LIVE_DATA.nightlyState}`);
  else if (cmd.includes('promote') || cmd.includes('retire')) addChatMessage('chief', 'Use the Strategies panel to promote/retire.');
  else addChatMessage('chief', `Commands: run nightly, kill switch, pause, resume, status`);
}

function escapeHtml(text) { return text.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>'); }

// ============ LIVE UPDATES ============
function startLiveUpdates() {
  setInterval(() => {
    LIVE_DATA.pnl += (Math.random() - 0.48) * 50;
    LIVE_DATA.tradesToday += Math.random() > 0.95 ? 1 : 0;
    if (Math.random() < 0.001) {
      const regimes = ['trend_up', 'trend_down', 'range_low_vol', 'range_high_vol'];
      LIVE_DATA.regime = regimes[Math.floor(Math.random() * regimes.length)];
      updateTopBar(); addChatMessage('chief', `🌊 Regime: ${LIVE_DATA.regime.toUpperCase()}`); chiefAvatar.voiceRingActive = true; chiefAvatar.voiceRingTimer = 1.5;
    }
    if (Math.random() < 0.0005) {
      const guard = LIVE_DATA.guards[Math.floor(Math.random() * LIVE_DATA.guards.length)];
      guard.ok = false; addChatMessage('chief', `⚠️ Guardian: ${guard.name} threshold (${guard.current}/${guard.limit})`); setTimeout(() => guard.ok = true, 5000);
    }
    updateTopBar();
  }, 2000);
  if (LIVE_DATA.nightlyState === 'running') animateNightlyProgress();
}

function updateTopBar() {
  const regimeBadge = document.getElementById('regimeBadge');
  regimeBadge.className = `regime-badge regime-${LIVE_DATA.regime}`;
  regimeBadge.textContent = LIVE_DATA.regime.toUpperCase().replace('_', ' ') + ' ' + (LIVE_DATA.regime === 'trend_up' ? '▲' : LIVE_DATA.regime === 'trend_down' ? '▼' : '◆');
  
  const killBadge = document.getElementById('killBadge'), killDot = document.getElementById('killDot');
  if (LIVE_DATA.killSwitch) { killBadge.className = 'kill-badge kill-active'; killDot.textContent = '●'; killBadge.childNodes[1].textContent = ' KILL ACTIVE'; }
  else { killBadge.className = 'kill-badge kill-safe'; killDot.textContent = '●'; killBadge.childNodes[1].textContent = ' GUARDIAN SAFE'; }
  
  document.getElementById('nightlyProgress').style.width = `${(LIVE_DATA.nightlyProgress * 100).toFixed(0)}%`;
  document.getElementById('nightlyPct').textContent = `${(LIVE_DATA.nightlyProgress * 100).toFixed(0)}%`;
  if (currentZone) openZonePanel(currentZone);
}

function updateClock() {
  const now = new Date(); const et = new Date(now.getTime() - 4 * 3600000);
  document.getElementById('etClock').textContent = et.toLocaleTimeString('en-US', { hour12: false, timeZone: 'America/New_York' }) + ' ET';
}

// ============ UTILITIES ============
function focusChief() {
  cameraTarget.x = gridToScreen(CHIEF_CENTER.x + CHIEF_CENTER.size/2, CHIEF_CENTER.y + CHIEF_CENTER.size/2).x - window.innerWidth * 0.15;
  cameraTarget.y = gridToScreen(CHIEF_CENTER.x + CHIEF_CENTER.size/2, CHIEF_CENTER.y + CHIEF_CENTER.size/2).y - window.innerHeight * 0.1;
  zoom = 1.5;
}

function toggleReducedMotion(enabled) { reducedMotion = enabled; document.getElementById('reducedMotionToggle').checked = enabled; if (enabled) { agentAvatars.forEach(a => a.body.scale.y = 1); chiefAvatar.body.y = 0; } }
function toggleMinimap() { minimapVisible = !minimapVisible; document.getElementById('minimap').style.display = minimapVisible ? 'block' : 'none'; }
</script>
