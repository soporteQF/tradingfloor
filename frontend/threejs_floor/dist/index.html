<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS QUANT FLOOR</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { background: #0a0a0f; font-family: 'Inter', sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    /* Loading screen */
    #loading { position: fixed; inset: 0; background: #0a0a0f; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 16px; color: #e8e8ed; font-family: 'JetBrains Mono', monospace; }
    .spinner { width: 48px; height: 48px; border: 3px solid #1a1a2e; border-top-color: #00d4aa; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadStatus { color: #7a7a8a; font-size: 13px; }
    /* UI Overlays */
    .overlay { position: fixed; pointer-events: none; z-index: 100; }
    .top-bar { top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, transparent 100%); border-bottom: 1px solid #1a1a2e; pointer-events: auto; }
    .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; color: #00d4aa; font-weight: 700; font-size: 14px; }
    .regime-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .regime-trend_up { background: #00d4aa22; color: #00d4aa; border: 1px solid #00d4aa44; }
    .regime-trend_down { background: #ff475722; color: #ff4757; border: 1px solid #ff475744; }
    .regime-range_low_vol { background: #7b68ee22; color: #7b68ee; border: 1px solid #7b68ee44; }
    .regime-range_high_vol { background: #ffa50222; color: #ffa502; border: 1px solid #ffa50244; }
    .kill-badge { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .kill-safe { background: #00d4aa22; color: #00d4aa; border: 1px solid #00d4aa44; }
    .kill-active { background: #ff475722; color: #ff4757; border: 1px solid #ff475744; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .nightly-progress { display: flex; align-items: center; gap: 8px; min-width: 180px; }
    .progress-bar { flex: 1; height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00d4aa, #7b68ee); border-radius: 3px; transition: width 0.3s ease; }
    .et-clock { color: #7a7a8a; font-size: 12px; font-variant-numeric: tabular-nums; }
    .minimap { bottom: 20px; right: 20px; width: 220px; height: 160px; background: rgba(10,10,15,0.95); border: 1px solid #1a1a2e; border-radius: 8px; overflow: hidden; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .minimap canvas { width: 100%; height: 100%; display: block; }
    .zone-panel { top: 60px; right: 20px; width: 320px; max-height: 60vh; background: rgba(10,10,15,0.98); border: 1px solid #1a1a2e; border-radius: 10px; padding: 16px; overflow-y: auto; pointer-events: auto; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .zone-panel.open { display: block; animation: slideIn 200ms ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .zone-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1a1a2e; }
    .zone-panel-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
    .zone-color { width: 12px; height: 12px; border-radius: 3px; }
    .zone-close { background: none; border: none; color: #7a7a8a; cursor: pointer; padding: 4px; font-size: 18px; line-height: 1; }
    .zone-metric { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #1a1a2e; }
    .zone-metric:last-child { border-bottom: none; }
    .metric-label { color: #7a7a8a; }
    .metric-value { color: #e8e8ed; font-weight: 600; }
    .metric-value.positive { color: #00d4aa; }
    .metric-value.negative { color: #ff4757; }
    .zone-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn { flex: 1; padding: 10px; border-radius: 6px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .btn-primary { background: #00d4aa; color: #0a0a0f; }
    .btn-primary:hover { background: #00e8bb; }
    .btn-danger { background: #ff4757; color: white; }
    .btn-danger:hover { background: #ff6b6b; }
    .btn-ghost { background: transparent; color: #7a7a8a; border: 1px solid #1a1a2e; }
    .btn-ghost:hover { background: #1a1a2e; color: #e8e8ed; }
    .chat-panel { bottom: 20px; left: 20px; width: 380px; height: 320px; background: rgba(10,10,15,0.98); border: 1px solid #1a1a2e; border-radius: 10px; display: flex; flex-direction: column; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid #1a1a2e; display: flex; align-items: center; justify-content: space-between; }
    .chat-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; }
    .chat-avatar { width: 24px; height: 24px; border-radius: 50%; background: #00d4aa22; display: flex; align-items: center; justify-content: center; color: #00d4aa; font-size: 10px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { display: flex; gap: 8px; max-width: 85%; animation: fadeIn 200ms ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-msg.chief { align-self: flex-start; }
    .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .chat-bubble { padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.4; }
    .chat-msg.chief .chat-bubble { background: #14141c; border: 1px solid #1a1a2e; border-bottom-left-radius: 3px; }
    .chat-msg.user .chat-bubble { background: #00d4aa; color: #0a0a0f; border-bottom-right-radius: 3px; }
    .chat-avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }
    .chat-avatar.chief { background: #00d4aa22; color: #00d4aa; }
    .chat-avatar.user { background: #1a1a2e; color: #e8e8ed; }
    .chat-input-area { padding: 12px 16px; border-top: 1px solid #1a1a2e; display: flex; gap: 8px; }
    .chat-input { flex: 1; background: #0a0a0f; border: 1px solid #1a1a2e; border-radius: 6px; padding: 8px 12px; color: #e8e8ed; font-family: inherit; font-size: 12px; outline: none; }
    .chat-input:focus { border-color: #00d4aa; }
    .chat-send { background: #00d4aa; color: #0a0a0f; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .controls-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 24px; padding: 12px 20px; background: rgba(10,10,15,0.95); border: 1px solid #1a1a2e; border-radius: 8px; font-size: 11px; color: #7a7a8a; pointer-events: none; z-index: 100; }
    .hint { display: flex; align-items: center; gap: 6px; }
    .hint kbd { background: #1a1a2e; border: 1px solid #2a2a3a; border-radius: 4px; padding: 2px 6px; font-family: inherit; font-size: 10px; }
    .reduced-motion-toggle { position: fixed; top: 60px; left: 20px; z-index: 100; pointer-events: auto; }
    .toggle { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(10,10,15,0.95); border: 1px solid #1a1a2e; border-radius: 6px; font-size: 11px; color: #7a7a8a; cursor: pointer; }
    .toggle:hover { border-color: #00d4aa; color: #00d4aa; }
    .toggle input { accent-color: #00d4aa; }
    @media (prefers-reduced-motion: reduce) { .chat-msg { animation: none; } }
  </style>
  <script type="module" crossorigin src="/assets/index-CZTAiALp.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-5QUC7LTd.js">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loadStatus">Cargando NEXUS QUANT FLOOR...</div>
  </div>
  <div id="app"></div>

  <!-- Top Bar -->
  <div class="top-bar overlay">
    <div class="top-bar-left">
      <div class="logo">
        <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" stroke="currentColor" strokeWidth="2"/><path d="M30 50 L45 65 L70 35" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        NEXUS QUANT FLOOR
      </div>
      <span class="regime-badge regime-trend_up" id="regimeBadge">TREND_UP ▲</span>
      <span class="kill-badge kill-safe" id="killBadge"><span id="killDot">●</span> GUARDIAN SAFE</span>
      <div class="nightly-progress">
        <span style="font-size:11px;color:#7a7a8a;">NIGHTLY</span>
        <div class="progress-bar"><div class="progress-fill" id="nightlyProgress" style="width: 80%"></div></div>
        <span id="nightlyPct" style="font-size:11px;color:#00d4aa;">80%</span>
      </div>
    </div>
    <div class="top-bar-right">
      <span class="et-clock" id="etClock">14:32:15 ET</span>
    </div>
  </div>

  <!-- Minimap -->
  <div class="minimap overlay" id="minimap"><canvas id="minimapCanvas"></canvas></div>

  <!-- Zone Panel -->
  <div class="zone-panel overlay" id="zonePanel">
    <div class="zone-panel-header">
      <div class="zone-panel-title"><span class="zone-color" id="zonePanelColor"></span><span id="zonePanelTitle">ZONE</span></div>
      <button class="zone-close" onclick="window.overlayManager?.closeZonePanel()">×</button>
    </div>
    <div id="zonePanelContent"></div>
    <div class="zone-actions" id="zonePanelActions"></div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel overlay">
    <div class="chat-header">
      <div class="chat-title"><div class="chat-avatar chief">🤖</div>CHIEF OF STAFF</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type command... (run nightly, kill switch, pause, status)" onkeydown="handleChatKeydown(event)">
      <button class="chat-send" onclick="window.overlayManager?.sendChat()">Send</button>
    </div>
  </div>

  <!-- Controls Hint -->
  <div class="controls-hint">
    <div class="hint"><kbd>WASD</kbd> Move operator</div>
    <div class="hint"><kbd>Click</kbd> Zone to inspect</div>
    <div class="hint"><kbd>Space</kbd> Focus Chief</div>
    <div class="hint"><kbd>M</kbd> Toggle minimap</div>
    <div class="hint"><kbd>R</kbd> Reduced motion</div>
  </div>

  <!-- Reduced Motion Toggle -->
  <div class="reduced-motion-toggle">
    <label class="toggle"><input type="checkbox" id="reducedMotionToggle" onchange="window.cameraController?.setReducedMotion(this.checked)"> Reduced Motion</label>
  </div>

</body>
</html>
