version: '3.8'

# DATA PLANE — Oracle Cloud Free Tier (ARM64, 24GB RAM, 200GB NVMe)
# Target: ~16 GB RAM | Workers, DuckDB, KuzuDB, Ollama 70b, vectorbt, ingestion 24/7

services:
  # ──────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 2G

  # ──────────────────────────────────────────────
  # LLMs (Ollama) — ARM64 native
  # ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    environment:
      - OLLAMA_NUM_GPU_LAYERS=0
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_BATCH_SIZE=256
      - OLLAMA_CONTEXT_SIZE=4096
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_USE_MMAP=true
      - OLLAMA_USE_MLOCK=false
      - OLLAMA_LOW_VRAM=true
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  ollama-pull:
    image: ollama/ollama:latest
    platform: linux/arm64
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      ollama pull llama3.1:8b-instruct-q4_K_M &&
      ollama pull llama3.1:70b-instruct-q4_K_M &&
      ollama pull qwen2.5-coder:7b-instruct-q4_K_M &&
      ollama pull bge-small-en-v1.5
    profiles: ["setup"]
    deploy:
      resources:
        limits:
          memory: 4G

  # Embeddings server (TEI CPU ARM64)
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    platform: linux/arm64
    command: >
      --model-id BAAI/bge-small-en-v1.5
      --dtype float32
      --pooling cls
      --max-client-batch-size 128
      --port 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ──────────────────────────────────────────────
  # CELERY WORKERS (Specialized by queue)
  # ──────────────────────────────────────────────
  worker-discovery:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arm64
    command: celery -A celery_workers.app worker -Q discovery -c 2 --prefetch-multiplier=2 -l INFO
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - EMBEDDINGS_URL=http://embeddings:8080
      - DUCKDB_PATH=/data/processed/analytics.duckdb
      - KUZUDB_PATH=/data/knowledge_graph/kuzu.db
      - SQLITE_VEC_PATH=/data/processed/vectors.db
      - WORKER_TYPE=discovery
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
      - ./scripts:/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  worker-validation:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arm64
    command: celery -A celery_workers.app worker -Q validation -c 2 --prefetch-multiplier=1 -l INFO
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - DUCKDB_PATH=/data/processed/analytics.duckdb
      - KUZUDB_PATH=/data/knowledge_graph/kuzu.db
      - WORKER_TYPE=validation
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

  worker-deployment:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arm64
    command: celery -A celery_workers.app worker -Q deployment -c 1 --prefetch-multiplier=1 -l INFO
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - DUCKDB_PATH=/data/processed/analytics.duckdb
      - KUZUDB_PATH=/data/knowledge_graph/kuzu.db
      - WORKER_TYPE=deployment
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  worker-learning:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arm64
    command: celery -A celery_workers.app worker -Q learning -c 1 --prefetch-multiplier=4 -l INFO
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - EMBEDDINGS_URL=http://embeddings:8080
      - KUZUDB_PATH=/data/knowledge_graph/kuzu.db
      - SQLITE_VEC_PATH=/data/processed/vectors.db
      - WORKER_TYPE=learning
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # ──────────────────────────────────────────────
  # CELERY BEAT (Scheduler)
  # ──────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arm64
    command: celery -A celery_workers.app beat -l INFO --scheduler celery_workers.schedulers:DatabaseScheduler
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - DUCKDB_PATH=/data/processed/analytics.duckdb
      - KUZUDB_PATH=/data/knowledge_graph/kuzu.db
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────
  # DATA INGESTION (24/7)
  # ──────────────────────────────────────────────
  data-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
      target: arm64
    command: python -m data_ingestion.main
    environment:
      - ENVIRONMENT=oracle
      - TIMEZONE=America/New_York
      - REDIS_URL=redis://redis:6379
      - DUCKDB_PATH=/data/processed/analytics.duckdb
      - CME_DATAMINE_PATH=/data/raw/cme_datamine
      - TRADOVATE_DEMO_URL=${TRADOVATE_DEMO_URL:-}
      - TRADOVATE_DEMO_TOKEN=${TRADOVATE_DEMO_TOKEN:-}
      - RITHMIC_DEMO_URL=${RITHMIC_DEMO_URL:-}
      - RITHMIC_DEMO_TOKEN=${RITHMIC_DEMO_TOKEN:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - OANDA_DEMO_TOKEN=${OANDA_DEMO_TOKEN:-}
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MICROSTRUCTURE (Rust gRPC) — Optional, L2 only
  # ──────────────────────────────────────────────
  microstructure:
    build:
      context: ./backend/rust_microstructure
      dockerfile: Dockerfile
      target: arm64
    command: ./microstructure-server
    environment:
      - RUST_LOG=info
      - GRPC_PORT=50051
      - RITHMIC_URL=${RITHMIC_DEMO_URL:-}
      - RITHMIC_TOKEN=${RITHMIC_DEMO_TOKEN:-}
    ports:
      - "50051:50051"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    profiles: ["microstructure"]

  # ──────────────────────────────────────────────
  # MONITORING (Prometheus + Grafana)
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:10.2
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────────
  # TAILSCALE (VPN mesh to Laptop)
  # ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_HOSTNAME=nexus-oracle
      - TS_EXTRA_ARGS=--advertise-routes=10.0.0.0/8 --accept-routes
    volumes:
      - tailscale_state:/var/lib/tailscale
    network_mode: host
    restart: unless-stopped

volumes:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  tailscale_state:

networks:
  default:
    name: nexus-oracle
    driver: bridge